<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Eco-Tracker 是一个绿色低碳打卡工具，帮助你记录每天的环保行为与减碳量。"
    />
    <title>Eco-Tracker · 绿色低碳打卡</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>Eco-Tracker</h1>
          <p>绿色低碳打卡</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="streak-badge" id="streak-badge" title="连续打卡天数">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M13.5 3c.4 3.1-1.4 5.4-3.6 6.6 1.6.4 3.4.3 4.6 1.5-.6 4.9-3.9 7.6-7.5 7.9 1.3-1.8 1.5-4.3.5-6-2.6 1-4.7 2.6-5.5 6C-.4 13.6 2.7 6.2 13.5 3Z" />
          </svg>
          <span id="streak-count">0</span>
          <span class="streak-label">天连续</span>
        </div>
        <div class="today-date" id="today-date"></div>
      </div>
    </header>

    <main class="container">
      <section class="stats-grid" id="stats-grid" aria-label="统计概览">
        <article class="stat-card stat-total">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">累计减碳</span>
            <span class="stat-value" id="total-co2">0<span class="stat-unit"> g</span></span>
          </div>
        </article>

        <article class="stat-card stat-streak">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M13.5 3c.4 3.1-1.4 5.4-3.6 6.6 1.6.4 3.4.3 4.6 1.5-.6 4.9-3.9 7.6-7.5 7.9 1.3-1.8 1.5-4.3.5-6-2.6 1-4.7 2.6-5.5 6C-.4 13.6 2.7 6.2 13.5 3Z" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">连续打卡</span>
            <span class="stat-value" id="streak-total">0<span class="stat-unit"> 天</span></span>
          </div>
        </article>

        <article class="stat-card stat-days">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">本月打卡</span>
            <span class="stat-value" id="month-days">0<span class="stat-unit"> 次</span></span>
          </div>
        </article>
      </section>

      <section class="main-grid">
        <article class="panel checkin-panel">
          <div class="panel-head">
            <h2>今日打卡</h2>
            <span class="panel-tag">选择行为</span>
          </div>
          <p class="panel-sub">勾选你今天完成的低碳行动，一次可以多选哦。</p>
          <div class="action-list" id="action-list"></div>
          <div class="checkin-total">
            <span>今日已减碳</span>
            <strong id="today-co2">0 <em>g</em></strong>
          </div>
          <button class="btn-primary" id="checkin-btn" type="button">完成打卡</button>
          <p class="checkin-hint" id="checkin-hint"></p>
        </article>

        <article class="panel goal-panel">
          <div class="panel-head">
            <h2>每周目标</h2>
            <span class="panel-tag" id="goal-days-left"></span>
          </div>
          <div class="goal-ring-wrap">
            <svg class="goal-ring" viewBox="0 0 120 120" width="150" height="150" aria-hidden="true">
              <circle class="goal-ring-bg" cx="60" cy="60" r="52" />
              <circle class="goal-ring-fg" id="goal-ring-fg" cx="60" cy="60" r="52" />
            </svg>
            <div class="goal-ring-center">
              <strong id="goal-percent">0%</strong>
              <span>达成率</span>
            </div>
          </div>
          <p class="goal-caption" id="goal-caption"></p>
        </article>
      </section>

      <section class="panel history-panel">
        <div class="panel-head">
          <h2>打卡历史</h2>
          <button class="btn-ghost" id="export-btn" type="button">导出数据</button>
        </div>
        <div class="week-strip" id="week-strip" aria-label="最近 14 天打卡情况"></div>
        <ul class="history-list" id="history-list"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>Eco-Tracker · 用每一次打卡，积攒一份绿色。</p>
    </footer>
    <script src="stats.js"></script>
  </body>
</html>
